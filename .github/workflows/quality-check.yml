name: Quality Check

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run automated tests
        run: npm test

      - name: Create JSON and HTML reports
        run: npm run scan -- ./demo-unsafe-app --report

      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        with:
          name: vibe-launch-report
          path: reports/vibe-launch-report.html
          if-no-files-found: error
          retention-days: 7